name: Build DedSec Launcher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" || true

      - name: Download Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip \
               -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist/
          chmod +x /tmp/gradle-dist/gradle-8.9/bin/gradle

      - name: Build debug APK
        run: |
          /tmp/gradle-dist/gradle-8.9/bin/gradle assembleDebug \
            --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchdogs-ctos-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
