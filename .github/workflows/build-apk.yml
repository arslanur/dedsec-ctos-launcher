name: Build DedSec Launcher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" || true

      - name: Extract Gradle wrapper JAR from distribution
        run: |
          mkdir -p gradle/wrapper
          # Download Gradle 8.9 binary distribution — only to extract the
          # bootstrap wrapper JAR. This avoids running "gradle wrapper" which
          # would trigger project evaluation (and Maven Central downloads) just
          # to produce the JAR.
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip \
               -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist/
          # Locate the wrapper bootstrap JAR inside the distribution
          WRAPPER_JAR=$(find /tmp/gradle-dist/gradle-8.9/lib \
                             -name "gradle-wrapper*.jar" 2>/dev/null | head -1)
          if [ -z "$WRAPPER_JAR" ]; then
            echo "ERROR: gradle-wrapper JAR not found; listing lib/:"
            ls -1 /tmp/gradle-dist/gradle-8.9/lib/
            exit 1
          fi
          echo "Wrapper JAR: $WRAPPER_JAR"
          cp "$WRAPPER_JAR" gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchdogs-ctos-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
